  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(90%, 600px);
      background: white;
      padding: 48px 36px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }
    h1 { margin-top: 0; font-size: 32px; }
    p { font-size: 18px; line-height: 1.6; color: #5b6470; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
      background: #1877f2;
      color: white;
      margin-top: 15px;
    }
    button:hover { opacity: .9; }
    .status {
      margin-top: 24px;
      font-size: 14px;
      color: #6b7280;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Página de Teste</h1>
    <p>
      Esta é uma página criada exclusivamente para estudar
      tráfego pago, Meta Ads e instalação de Pixel.
    </p>

    <button id="botaoTeste">Quero saber mais</button>

    <div class="status">
      Página de teste — nenhum produto ou venda real.
    </div>
  </main>

  <script>
    document.getElementById("botaoTeste").addEventListener("click", function () {
      alert("Clique registrado! Você pode usar este botão para testar eventos.");
    });
  </script>
</body>
</html>
